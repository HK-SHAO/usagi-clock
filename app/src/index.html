<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#f9eccc" />
    <meta name="description" content="Usagi Clock" />
    <link rel="icon" href="./favicon.webp" />
    <title>UsagiClock</title>
    <script src="https://s1.hdslb.com/bfs/seed/toy/app/sdk/toy-sdk.js"></script>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <!-- 加载指示器（首帧就绪后隐藏） -->
      <div id="loading">
        <div class="loading-dot"></div>
      </div>
      <!-- 帧容器（容器查询作用域 + Canvas 渲染） -->
      <canvas id="stage"></canvas>
      <!-- 时钟显示 -->
      <div id="clock"></div>
      <!-- 音频未解锁提示（非阻塞，点击穿透） -->
      <div id="audio-hint">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
        </svg>
        <span>点击任意位置开启声音</span>
      </div>
      <!-- 设置面板容器 -->
      <div id="settings-container"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
